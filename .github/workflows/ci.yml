name: MilkRun Full-Stack CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  simulator-tests:
    name: Node.js Simulator CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          
      - name: Install Dependencies
        working-directory: simulator
        run: npm ci || npm install
        
      - name: Execute Vitest Suite
        working-directory: simulator
        run: npm run test

  backend-tests:
    name: Java Spring Boot CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'
          
      - name: Run Maven Unit Tests
        working-directory: backend
        run: mvn -B test

  frontend-build:
    name: React Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          
      - name: Verify Application Build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
