server {
    listen 80;
    server_name localhost;

    # Static React build with SPA fallback
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API and SSE stream are served by the Spring Boot backend
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-Sent Events: stream responses as they are produced instead of
        # buffering them, and keep the upstream connection open.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_read_timeout 1h;
    }
}
