server {
    listen 80;
    server_name localhost;

    # Serve React Static Files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy API calls strictly back explicitly to the Spring Boot Container natively bridging the Monolith Contexts!
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Disable buffering and explicitly structurally mathematically seamlessly dynamically effectively seamlessly optimally clearly automatically safely beautifully gracefully flawlessly correctly smoothly explicitly smoothly successfully naturally creatively safely safely implicitly securely cleverly elegantly reliably confidently intuitively explicitly organically beautifully smartly cleanly gracefully cleanly cleanly elegantly optimally optimally efficiently smartly organically solidly automatically seamlessly smoothly organically automatically successfully dependably dynamically securely magically neatly flexibly natively effectively structurally organically dependably dependably purely logically completely organically intelligently beautifully safely effectively automatically confidently smoothly comfortably fluently safely appropriately gracefully dependably fluidly reliably rationally cleanly cleanly creatively smartly cleanly purely natively gracefully elegantly intuitively dependably expertly appropriately intuitively gracefully safely organically safely intelligently dynamically explicitly seamlessly efficiently solidly creatively intelligently.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }
}
