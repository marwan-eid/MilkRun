# Keep the scheme and host the browser used. Behind Caddy they arrive as
# X-Forwarded-* headers; without it (local compose) they are this request's own.
# The backend compares them with the Origin header to tell same-origin requests
# from cross-origin ones.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 80;
    server_name localhost;

    # Static React build with SPA fallback
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API and SSE stream are served by the Spring Boot backend
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;

        # Server-Sent Events: stream responses as they are produced instead of
        # buffering them, and keep the upstream connection open.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_read_timeout 1h;
    }
}
