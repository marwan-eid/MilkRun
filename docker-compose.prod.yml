# Production stack for the single-VM demo.
#
# Only Caddy publishes ports on the host (80/443). Kafka, Zookeeper, PostgreSQL
# and the backend are reachable only on the compose network. Credentials come
# from a .env file next to this file (see .env.example); the defaults match the
# values the existing database volume was initialised with.

services:
  # ==========================================
  #   Infrastructure: Zookeeper & Kafka
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # The image defaults to a 1 GB heap; the demo VM has 1 GB of RAM in total
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx64m"
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    restart: always

  # ==========================================
  #   Database: PostgreSQL + PostGIS
  # ==========================================
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-milkrun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-milkrun_secret}
      POSTGRES_DB: milkrun
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-milkrun}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # ==========================================
  #   Application: Java Spring Boot engine
  # ==========================================
  backend:
    image: ${MILKRUN_IMAGE_REGISTRY:-ghcr.io/marwan-eid}/milkrun-backend:${MILKRUN_IMAGE_TAG:-latest}
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/milkrun
      - SPRING_R2DBC_USERNAME=${POSTGRES_USER:-milkrun}
      - SPRING_R2DBC_PASSWORD=${POSTGRES_PASSWORD:-milkrun_secret}
      - SPRING_FLYWAY_URL=jdbc:postgresql://postgres:5432/milkrun
      - MILKRUN_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_PROFILES_ACTIVE=prod
    restart: on-failure

  # ==========================================
  #   Application: fleet simulator
  # ==========================================
  simulator:
    image: ${MILKRUN_IMAGE_REGISTRY:-ghcr.io/marwan-eid}/milkrun-simulator:${MILKRUN_IMAGE_TAG:-latest}
    build:
      context: ./simulator
    depends_on:
      kafka:
        condition: service_started
      backend:
        condition: service_started
    environment:
      - KAFKA_BROKERS=kafka:9092
      - VAN_COUNT=${VAN_COUNT:-50}
    restart: on-failure

  # ==========================================
  #   Application: React build served by nginx (proxies /api)
  # ==========================================
  frontend:
    image: ${MILKRUN_IMAGE_REGISTRY:-ghcr.io/marwan-eid}/milkrun-frontend:${MILKRUN_IMAGE_TAG:-latest}
    build:
      context: ./frontend
    depends_on:
      - backend
    restart: always

  # ==========================================
  #   Edge proxy: Caddy with automatic HTTPS
  # ==========================================
  caddy:
    image: caddy:2.7.6-alpine
    container_name: milkrun-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  # ==========================================
  #   Monitoring (opt-in): docker compose --profile monitoring up -d
  #   Bound to localhost only; reach it with an SSH tunnel, e.g.
  #   ssh -L 9090:localhost:9090 -L 3001:localhost:3001 <vm>
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [ "monitoring" ]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [ "monitoring" ]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  caddy_data:
  caddy_config:
  prometheus-data:
  grafana-data:
