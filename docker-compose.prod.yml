# Production stack for the single-VM demo.
#
# Only Caddy publishes ports on the host (80/443). Kafka, Zookeeper, PostgreSQL
# and the backend are reachable only on the compose network. Credentials come
# from a .env file next to this file (see .env.example); the defaults match the
# values the existing database volume was initialised with.

services:
  # ==========================================
  #   Infrastructure: Zookeeper & Kafka
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: always

  # ==========================================
  #   Database: PostgreSQL + PostGIS
  # ==========================================
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-milkrun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-milkrun_secret}
      POSTGRES_DB: milkrun
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-milkrun}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # ==========================================
  #   Application: Java Spring Boot engine
  # ==========================================
  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/milkrun
      - SPRING_R2DBC_USERNAME=${POSTGRES_USER:-milkrun}
      - SPRING_R2DBC_PASSWORD=${POSTGRES_PASSWORD:-milkrun_secret}
      - MILKRUN_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_PROFILES_ACTIVE=prod
    restart: on-failure

  # ==========================================
  #   Application: fleet simulator
  # ==========================================
  simulator:
    build:
      context: ./simulator
    depends_on:
      kafka:
        condition: service_started
      backend:
        condition: service_started
    environment:
      - KAFKA_BROKERS=kafka:9092
      - VAN_COUNT=50
    restart: on-failure

  # ==========================================
  #   Application: React build served by nginx (proxies /api)
  # ==========================================
  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    restart: always

  # ==========================================
  #   Edge proxy: Caddy with automatic HTTPS
  # ==========================================
  caddy:
    image: caddy:2.7.6-alpine
    container_name: milkrun-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  postgres-data:
  caddy_data:
  caddy_config:
