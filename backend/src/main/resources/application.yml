spring:
  application:
    name: milkrun-backend

  kafka:
    bootstrap-servers: ${MILKRUN_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      bootstrap-servers: ${MILKRUN_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  # ═══ R2DBC PostgreSQL ═══
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/milkrun}
    username: ${SPRING_R2DBC_USERNAME:milkrun}
    password: ${SPRING_R2DBC_PASSWORD:milkrun_secret}

  # ═══ Flyway (JDBC, runs before the pipelines start) ═══
  # Baseline 0 + idempotent V1: databases created by the old init.sql already
  # hold the V1 objects, so V1 is a no-op there and later versions still apply.
  flyway:
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/milkrun}
    user: ${spring.r2dbc.username}
    password: ${spring.r2dbc.password}
    baseline-on-migrate: true
    baseline-version: 0

# ═══ Kafka ═══

milkrun:
  kafka:
    bootstrap-servers: ${MILKRUN_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    gps-topic: gps-events
    delivery-topic: delivery-events
    dlq-topic: gps-events-dlq
    route-plans-topic: route-plans
    van-state-topic: van-state
    dispatch-topic: dispatch-events
    consumer-group: milkrun-engine
    # Where a new consumer group starts; tests use earliest
    auto-offset-reset: latest
    # How often acknowledged offsets are committed
    commit-interval: 5s
  pipeline:
    # window: exact sliding-window dedup (default); bloom: Bloom filter
    dedup-strategy: window
    dedup-window-size: 4096
    dedup-expected-insertions: 100000
    dedup-false-positive-rate: 0.001
    reorder-buffer-grace-ms: 3000
    reorder-buffer-max-size: 50
    # How often the reorder buffer releases events past the grace window
    release-interval-ms: 100
  archive:
    # At most one archived GPS point per van per interval (device time)
    min-interval: 2s
  eta:
    # Slack = deadline - predicted arrival (wall-clock seconds).
    # Below the critical buffer the stop is projected to miss its slot.
    sla-warning-buffer-seconds: 60
    sla-critical-buffer-seconds: 0
    # Straight-line fallback: road distance is about this much longer.
    detour-factor: 1.3
    # Farther than this from the planned route, the van is treated as off-route.
    off-route-meters: 200
  backpressure:
    sample-interval-ms: 500
  fanout:
    # local: one backend instance sees every van (default).
    # kafka: several instances share van states through the van-state topic.
    mode: ${MILKRUN_FANOUT_MODE:local}
    publish-interval-ms: 500
  # Origins allowed to call the API cross-origin (the dashboard itself is same-origin)
  cors:
    allowed-origins: ${MILKRUN_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://marwan-eid.github.io}
  dispatch:
    service-area:
      min-lat: 52.28
      max-lat: 52.43
      min-lon: 4.75
      max-lon: 5.02
    rate-limit:
      client-burst: 3
      client-per-minute: 6
      global-per-minute: 60

# ═══ Actuator ═══
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: milkrun
    distribution:
      percentiles-histogram:
        http.server.requests: true

server:
  port: 8080
  # Behind Caddy and nginx: take scheme, host and client address from the
  # X-Forwarded-* headers, so a same-origin browser request is recognised as
  # such by CORS. The backend port is never exposed outside the proxies.
  forward-headers-strategy: framework

logging:
  level:
    com.milkrun: DEBUG
    reactor.kafka: INFO
