version: '3.8'

services:
  # ═══════════════════════════════════════════════
  # Apache Kafka (KRaft mode – no Zookeeper)
  # ═══════════════════════════════════════════════
  kafka:
    image: apache/kafka:3.7.0
    container_name: milkrun-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: "MilkRunKafkaCluster001"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ═══════════════════════════════════════════════
  # Topic Initialization
  # ═══════════════════════════════════════════════
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: milkrun-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Creating Kafka topics...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic gps-events --partitions 10 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic delivery-events --partitions 10 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic gps-events-dlq --partitions 3 --replication-factor 1
      echo 'Topics created:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      echo 'Done!'
      "

  # ═══════════════════════════════════════════════
  # PostgreSQL + PostGIS
  # ═══════════════════════════════════════════════
  postgres:
    image: postgis/postgis:16-3.4
    container_name: milkrun-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: milkrun
      POSTGRES_USER: milkrun
      POSTGRES_PASSWORD: milkrun_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: pg_isready -U milkrun -d milkrun
      interval: 5s
      timeout: 3s
      retries: 5

  # ═══════════════════════════════════════════════
  # Prometheus (Metrics Scraping)
  # ═══════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: milkrun-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ═══════════════════════════════════════════════
  # Grafana (Metrics Dashboards)
  # ═══════════════════════════════════════════════
  grafana:
    image: grafana/grafana:11.1.0
    container_name: milkrun-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: milkrun
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  kafka-data:
  postgres-data:
  prometheus-data:
  grafana-data:
